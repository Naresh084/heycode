# Q14–Q16 release definition: native binaries, keyless attestations, manifest,
# and deterministic plus real-provider fresh-home evidence.
#
# THIS WORKFLOW HAS NEVER RUN. Its presence proves only that the jobs are
# defined. It is not native/hosted evidence until an actual non-zero run uploads
# and the final matrix job accepts all three real-provider artifacts.
#
# Signing uses GitHub Actions OIDC and `actions/attest`; no long-lived signing
# key or production secret is created or required. Every downloaded binary and
# the release manifest are paired with their Sigstore bundle. A shipping
# product verifier rechecks those downloaded bundles before publication.

name: Release artifacts (native evidence pending)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Strict release version, for example 1.2.0 or 1.3.0-preview.1"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build and attest ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TARGET_DIR: ${{ runner.temp }}/heycode-dist-target
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - name: Require the exact version tag
        shell: bash
        run: |
          set -euo pipefail
          version='${{ inputs.version }}'
          case "$version" in
            ''|*[!0-9A-Za-z.-]*) echo "invalid release version" >&2; exit 1 ;;
          esac
          expected="refs/tags/v${version}"
          test "$GITHUB_REF" = "$expected" || {
            echo "release workflow must run from the exact version tag" >&2
            exit 1
          }

      - uses: actions/checkout@v4

      - name: Resolve native platform
        id: native
        shell: bash
        run: |
          set -euo pipefail
          case "${RUNNER_OS}-${RUNNER_ARCH}" in
            macOS-ARM64) platform=macos-aarch64; extension= ;;
            macOS-X64) platform=macos-x86_64; extension= ;;
            Linux-X64) platform=linux-x86_64; extension= ;;
            Windows-X64) platform=windows-x86_64; extension=.exe ;;
            *) echo "unsupported native runner ${RUNNER_OS}-${RUNNER_ARCH}" >&2; exit 1 ;;
          esac
          echo "platform=$platform" >> "$GITHUB_OUTPUT"
          echo "extension=$extension" >> "$GITHUB_OUTPUT"

      - name: Build native binary
        run: cargo build --profile dist --locked -p heycode-cli

      - name: Stage exact release subject
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp "$CARGO_TARGET_DIR/dist/heycode${{ steps.native.outputs.extension }}" \
            "artifacts/heycode-${{ steps.native.outputs.platform }}${{ steps.native.outputs.extension }}"

      - name: Record exact distribution size
        shell: bash
        run: |
          set -euo pipefail
          platform=${{ steps.native.outputs.platform }}
          binary="artifacts/heycode-${platform}${{ steps.native.outputs.extension }}"
          binary_bytes=$(wc -c < "$binary" | tr -d '[:space:]')
          test "$binary_bytes" -gt 0
          case "$platform" in
            macos-aarch64) maximum_binary_bytes=20971520 ;;
            *) maximum_binary_bytes= ;;
          esac
          if [ -n "$maximum_binary_bytes" ] && [ "$binary_bytes" -gt "$maximum_binary_bytes" ]; then
            echo "distribution artifact exceeds the observed platform budget" >&2
            exit 1
          fi
          budget_json=${maximum_binary_bytes:-null}
          printf '{"schema_version":1,"platform":"%s","profile":"dist","binary_bytes":%s,"maximum_binary_bytes":%s}\n' \
            "$platform" "$binary_bytes" "$budget_json" > "artifacts/${platform}.size.json"
          {
            echo "### Distribution artifact size"
            echo
            echo "| Platform | Profile | Exact bytes | Observed budget |"
            echo "|---|---:|---:|---:|"
            echo "| ${platform} | dist | ${binary_bytes} | ${maximum_binary_bytes:-unbaselined} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attest binary provenance
        id: attest
        uses: actions/attest@v4
        with:
          subject-path: artifacts/heycode-${{ steps.native.outputs.platform }}${{ steps.native.outputs.extension }}

      - name: Retain bundle and digests
        shell: bash
        run: |
          set -euo pipefail
          platform=${{ steps.native.outputs.platform }}
          binary="artifacts/heycode-${platform}${{ steps.native.outputs.extension }}"
          cp "${{ steps.attest.outputs.bundle-path }}" "artifacts/${platform}.sigstore.json"
          shasum -a 256 "$binary" | awk '{print "sha256:"$1}' > "artifacts/${platform}.digest"
          shasum -a 256 "artifacts/${platform}.sigstore.json" \
            | awk '{print "sha256:"$1}' > "artifacts/${platform}.bundle-digest"

      - uses: actions/upload-artifact@v4
        with:
          name: heycode-${{ steps.native.outputs.platform }}
          path: artifacts/

  manifest:
    name: Assemble and attest release manifest
    needs: build
    runs-on: ubuntu-latest
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: heycode-*
          path: downloaded

      - name: Assemble schema-v2 manifest deterministically
        shell: bash
        run: |
          set -euo pipefail
          version='${{ inputs.version }}'
          case "$version" in
            ''|*[!0-9A-Za-z.-]*) echo "invalid release version" >&2; exit 1 ;;
          esac
          config_schema=$(grep -oE 'CONFIG_SCHEMA_VERSION: u32 = [0-9]+' \
            crates/heycode-config/src/migration.rs | grep -oE '[0-9]+$')
          plugin_api=$(grep -oE 'PLUGIN_API_VERSION: u32 = [0-9]+' \
            crates/heycode-extensions/src/lib.rs | grep -oE '[0-9]+$')
          rows=
          while IFS= read -r digest_file; do
            platform=$(basename "$digest_file" .digest)
            digest=$(cat "$digest_file")
            bundle_digest=$(cat "${digest_file%.digest}.bundle-digest")
            row="{\"platform\":\"${platform}\",\"digest\":\"${digest}\",\"attestation\":{\"scheme\":\"github_sigstore_bundle_v1\",\"bundle_digest\":\"${bundle_digest}\"}}"
            rows="${rows}${rows:+,}${row}"
          done < <(find downloaded -name '*.digest' -type f | sort)
          test -n "$rows"
          printf '{"schema_version":2,"version":"%s","config_schema_version":%s,"plugin_api_version":%s,"artifacts":[%s]}' \
            "$version" "$config_schema" "$plugin_api" "$rows" > release-manifest.json
          shasum -a 256 release-manifest.json | awk '{print "sha256:"$1}' \
            > release-manifest.digest

      - name: Attest manifest provenance
        id: attest_manifest
        uses: actions/attest@v4
        with:
          subject-path: release-manifest.json

      - name: Retain manifest bundle
        shell: bash
        run: cp "${{ steps.attest_manifest.outputs.bundle-path }}" release-manifest.sigstore.json

      - uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: |
            release-manifest.json
            release-manifest.digest
            release-manifest.sigstore.json

  onboarding-native:
    name: Native install and onboarding ${{ matrix.os }}
    needs: manifest
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve native platform
        id: native
        shell: bash
        run: |
          set -euo pipefail
          case "${RUNNER_OS}-${RUNNER_ARCH}" in
            macOS-ARM64) platform=macos-aarch64; extension= ;;
            macOS-X64) platform=macos-x86_64; extension= ;;
            Linux-X64) platform=linux-x86_64; extension= ;;
            Windows-X64) platform=windows-x86_64; extension=.exe ;;
            *) echo "unsupported native runner ${RUNNER_OS}-${RUNNER_ARCH}" >&2; exit 1 ;;
          esac
          echo "platform=$platform" >> "$GITHUB_OUTPUT"
          echo "extension=$extension" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: heycode-${{ steps.native.outputs.platform }}
          path: binary

      - uses: actions/download-artifact@v4
        with:
          name: release-manifest
          path: manifest

      - name: Verify binary and manifest attestations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          platform=${{ steps.native.outputs.platform }}
          binary="binary/heycode-${platform}${{ steps.native.outputs.extension }}"
          identity="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/release-verification.yml@${GITHUB_REF}"
          gh attestation verify "$binary" --repo "$GITHUB_REPOSITORY" \
            --bundle "binary/${platform}.sigstore.json" --cert-identity "$identity"
          gh attestation verify manifest/release-manifest.json --repo "$GITHUB_REPOSITORY" \
            --bundle manifest/release-manifest.sigstore.json --cert-identity "$identity"

      - name: Install through the shipping release manager (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          product_home="$RUNNER_TEMP/heycode-release-home"
          install_root="$RUNNER_TEMP/heycode-release-install"
          artifact="$GITHUB_WORKSPACE/binary/heycode-${{ steps.native.outputs.platform }}${{ steps.native.outputs.extension }}"
          mkdir -p "$product_home"
          chmod 0755 "$artifact"
          HEYCODE_HOME="$product_home" "$artifact" release apply \
            --root "$install_root" \
            --manifest "$GITHUB_WORKSPACE/manifest/release-manifest.json" \
            --manifest-bundle "$GITHUB_WORKSPACE/manifest/release-manifest.sigstore.json" \
            --artifact "$artifact" \
            --artifact-bundle "$GITHUB_WORKSPACE/binary/${{ steps.native.outputs.platform }}.sigstore.json" \
            --repo "$GITHUB_REPOSITORY" \
            --workflow .github/workflows/release-verification.yml \
            --source-ref "$GITHUB_REF" \
            --channel "pinned:${{ inputs.version }}" \
            --gh "$(command -v gh)"
          echo "HEYCODE_INSTALLED_BINARY=$install_root/bin/heycode" >> "$GITHUB_ENV"

      - name: Install through the shipping release manager (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $productHome = Join-Path $env:RUNNER_TEMP "heycode-release-home"
          $installRoot = Join-Path $env:RUNNER_TEMP "heycode-release-install"
          $manifest = Join-Path $env:GITHUB_WORKSPACE "manifest/release-manifest.json"
          $manifestBundle = Join-Path $env:GITHUB_WORKSPACE "manifest/release-manifest.sigstore.json"
          $artifact = Join-Path $env:GITHUB_WORKSPACE "binary/heycode-${{ steps.native.outputs.platform }}${{ steps.native.outputs.extension }}"
          $artifactBundle = Join-Path $env:GITHUB_WORKSPACE "binary/${{ steps.native.outputs.platform }}.sigstore.json"
          New-Item -ItemType Directory -Force -Path $productHome | Out-Null
          $gh = (Get-Command gh).Source
          $env:HEYCODE_HOME = $productHome
          & $artifact release apply `
            --root $installRoot `
            --manifest $manifest `
            --manifest-bundle $manifestBundle `
            --artifact $artifact `
            --artifact-bundle $artifactBundle `
            --repo $env:GITHUB_REPOSITORY `
            --workflow .github/workflows/release-verification.yml `
            --source-ref $env:GITHUB_REF `
            --channel "pinned:${{ inputs.version }}" `
            --gh $gh
          if ($LASTEXITCODE -ne 0) {
            throw "shipping release manager install failed"
          }
          "HEYCODE_INSTALLED_BINARY=$installRoot/bin/heycode.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run deterministic fresh-home turn (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash release-support/run-fresh-machine-smoke.sh \
            "$HEYCODE_INSTALLED_BINARY" \
            "${{ steps.native.outputs.platform }}" onboarding-evidence.json

      - name: Run real-provider fresh-home turn (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash release-support/run-fresh-machine-smoke.sh \
            "$HEYCODE_INSTALLED_BINARY" \
            "${{ steps.native.outputs.platform }}" onboarding-real-evidence.json real-openrouter

      - name: Run deterministic fresh-home turn (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./release-support/run-fresh-machine-smoke.ps1 `
            -Binary $env:HEYCODE_INSTALLED_BINARY `
            -Platform "${{ steps.native.outputs.platform }}" `
            -Evidence onboarding-evidence.json

      - name: Run real-provider fresh-home turn (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./release-support/run-fresh-machine-smoke.ps1 `
            -Binary $env:HEYCODE_INSTALLED_BINARY `
            -Platform "${{ steps.native.outputs.platform }}" `
            -Evidence onboarding-real-evidence.json `
            -Mode real-openrouter

      - uses: actions/upload-artifact@v4
        with:
          name: onboarding-evidence-${{ steps.native.outputs.platform }}
          path: |
            onboarding-evidence.json
            onboarding-real-evidence.json

  certify-onboarding:
    name: Certify Q16 real-provider matrix
    needs: onboarding-native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          pattern: onboarding-evidence-*
          path: evidence

      - name: Evaluate content-free native evidence
        shell: bash
        run: |
          set -euo pipefail
          files=()
          while IFS= read -r file; do files+=("$file"); done \
            < <(find "$GITHUB_WORKSPACE/evidence" -name onboarding-real-evidence.json -type f | sort)
          test "${#files[@]}" -eq 3
          HEYCODE_HOME="$RUNNER_TEMP/heycode-evidence-home" \
            cargo run -q -p heycode-cli -- release evidence "${files[@]}"
