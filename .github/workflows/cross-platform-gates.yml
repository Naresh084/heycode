name: Cross-platform gates

on:
  pull_request:
  push:
    branches:
      - main
      - master
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-platform-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.97.1

jobs:
  format:
    name: Formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt
          rustup default "$RUST_TOOLCHAIN"

      - name: Check formatting
        run: cargo fmt --all --check

  gates:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-24.04
          - name: macOS aarch64
            runner: macos-15
          - name: Windows x86_64
            runner: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pinned Rust toolchain (unix)
        if: runner.os != 'Windows'
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          rustup default "$RUST_TOOLCHAIN"

      - name: Install pinned Rust toolchain (Windows)
        if: runner.os == 'Windows'
        run: |
          rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal --component clippy
          rustup default $env:RUST_TOOLCHAIN

      - name: Install Linux sandbox runtime prerequisite
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          test "$(command -v bwrap)" = /usr/bin/bwrap

      - name: Record the toolchain actually in use
        run: |
          rustc --version --verbose
          cargo --version

      - name: Run the native sandbox truth and path attack matrix
        run: cargo test --locked -p heycode-sandbox --test main -- --nocapture

      - name: Lint the workspace
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Run the workspace test suite
        if: ${{ !cancelled() }}
        run: cargo test --locked --workspace --all-targets --no-fail-fast

      - name: Run doctests
        if: ${{ !cancelled() }}
        run: cargo test --locked --workspace --doc
