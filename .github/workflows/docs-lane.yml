# DOC04/DOC05 documentation lane gate.
#
# ────────────────────────────────────────────────────────────────────────────
# THIS WORKFLOW HAS NEVER RUN ON GITHUB ACTIONS. No push, pull request, or
# dispatch in this repository has executed it, so it is not evidence that the
# docs lane passes on a hosted runner. What IS verified locally on 2026-08-31:
# `python3 -m unittest discover -s scripts/tests` passes (4 tests), and
# `scripts/verify_docs.py`'s freshness step fails on an injected stale
# reference and leaves the drift on disk instead of erasing it.
#
# Why this file exists. `scripts/verify_docs.py` is the documentation lane's
# only gate and nothing automated ran it, so principle #14 — the gate existing
# is not the gate passing — was unenforced for the one lane whose gate is a
# script rather than a Rust test. Worse, until this change the script called
# `write_all(rendered)` BEFORE `check_all(rendered)`, comparing the bytes it
# had just written against the dict it wrote them from: the stale branch was
# unreachable and drift was silently repaired rather than reported.
#
# `verify_docs.py` is invoked WITHOUT `--write` here, deliberately and
# permanently. `--write` regenerates first, which makes the freshness result
# trivially true; a CI job that regenerates its own expectation cannot fail.
# Regeneration is a human step: run `python3 scripts/verify_docs.py --write`
# after changing a descriptor consumed by a generated page, and commit the
# resulting diff.
#
# `crates/**` is inside the path filter because the four generated references
# are derived from Rust contracts — a crate-only change is exactly what makes a
# checked-in reference stale — and because the one `docs-check: run` example in
# docs/guides/getting-started.md builds and runs the CLI. That example is why
# this job installs a Rust toolchain at all.
#
# Deliberately no cache action, matching cross-platform-gates.yml: pinning
# another third-party action by SHA in a workflow that has never run is a claim
# this file is not in a position to make.
# ────────────────────────────────────────────────────────────────────────────

name: Documentation lane (NEVER EXECUTED on CI)

"on":
  pull_request:
    paths:
      - "docs/**"
      - "scripts/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/docs-lane.yml"
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-lane-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  PYTHONDONTWRITEBYTECODE: "1"
  RUST_TOOLCHAIN: "1.97.1"

jobs:
  docs:
    name: Generated references, links, examples, diagrams
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"

      - name: Record the toolchain actually in use
        run: |
          python3 --version
          rustc --version
          cargo --version

      - name: Compile the documentation scripts
        run: python3 -m compileall -q scripts

      # These tests hold the gate itself to the property it exists to provide:
      # a stale generated reference must fail verification, and verification
      # must not rewrite the file it is comparing.
      - name: Test the documentation gate
        run: python3 -m unittest discover -s scripts/tests -v

      # No `--write`. See the header.
      - name: Verify the documentation lane
        run: python3 scripts/verify_docs.py

      # A verification run that mutated the checkout would be the defect this
      # lane just fixed, reappearing. Fail if anything moved.
      - name: Prove verification did not rewrite the generated references
        run: git diff --exit-code -- docs/
