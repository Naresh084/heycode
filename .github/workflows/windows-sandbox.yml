name: Windows process isolation runtime

on:
  pull_request:
    paths:
      - ".github/workflows/windows-sandbox.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/heycode-core/**"
      - "crates/heycode-exec/**"
      - "crates/heycode-sandbox/**"
  push:
    paths:
      - ".github/workflows/windows-sandbox.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/heycode-core/**"
      - "crates/heycode-exec/**"
      - "crates/heycode-sandbox/**"
  schedule:
    - cron: "7 8 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-sandbox-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-matrix:
    name: Job Object cleanup and unsupported-sandbox matrix
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
      RUST_TOOLCHAIN: 1.97.1
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal --component clippy,rustfmt
          rustup default $env:RUST_TOOLCHAIN

      - name: Verify pinned Windows runner prerequisites
        shell: pwsh
        run: |
          if ($env:RUNNER_OS -ne "Windows") {
            throw "expected a Windows GitHub-hosted runner"
          }
          $caption = (Get-CimInstance Win32_OperatingSystem).Caption
          if ($caption -notmatch "Windows Server 2022") {
            throw "expected Windows Server 2022, received $caption"
          }
          if (-not [Environment]::Is64BitOperatingSystem) {
            throw "expected a 64-bit Windows runner"
          }
          rustc -Vv

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint Windows execution targets
        run: cargo clippy --locked -p heycode-exec -p heycode-sandbox --all-targets -- -D warnings

      - name: Run provider-neutral subprocess contracts
        run: cargo test --locked -p heycode-exec --test main it::subprocess_contract -- --nocapture

      - name: Run Windows native runtime matrix
        run: cargo test --locked -p heycode-sandbox --test main it::windows_runtime -- --nocapture
