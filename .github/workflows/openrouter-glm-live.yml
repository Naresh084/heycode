name: OpenRouter GLM live lane

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  glm-live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HEYCODE_E2E: "1"
      HEYCODE_LIVE_ARTIFACT_DIR: ${{ runner.temp }}/heycode-live-artifacts
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run production catalog, reasoning, text and tool canaries
        run: cargo test -p heycode-cli live_openrouter_glm_text_tool_catalog_lane_is_explicitly_gated -- --nocapture
      - name: Run provider search and routing conformance canary
        run: cargo test -p heycode-provider-openrouter live_glm_text_tool_search_routing_artifact_is_explicitly_gated -- --nocapture
      - name: Upload credential-free live artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openrouter-glm-live-artifact
          path: ${{ runner.temp }}/heycode-live-artifacts/*.json
          if-no-files-found: error
          retention-days: 14
