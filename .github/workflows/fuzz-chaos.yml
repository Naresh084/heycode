# Q12/Q13 evidence infrastructure.
#
# This workflow has never executed on a hosted runner. Its existence is not
# crash-free continuous-run evidence. Local macOS arm64 evidence on 2026-08-31
# is a green fixed-seed chaos pass, 128 libFuzzer/ASan runs each for session,
# config, provider and MCP, and the 8-run high-cost render seed set after its
# ANSI/OSC boundary repair. The scheduled matrix remains unobserved until
# GitHub records its first run.
name: Fuzz and chaos (HOSTED RUNS UNOBSERVED)

on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      run_bounded_fuzz:
        description: Run the scheduled three-minute-per-target fuzz matrix
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: fuzz-chaos-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "0"
  RUST_TOOLCHAIN: "1.97.1"
  HEYCODE_FUZZ_TOOLCHAIN: "nightly-2026-08-30"

jobs:
  deterministic-smoke:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust fuzz toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup default "$RUST_TOOLCHAIN"
          rustup toolchain install "$HEYCODE_FUZZ_TOOLCHAIN" --profile minimal --component rust-src
          cargo install cargo-fuzz --version 0.13.2 --locked

      - name: Check isolated harnesses
        run: |
          cargo fmt --manifest-path chaos/Cargo.toml -- --check
          cargo clippy --locked --manifest-path chaos/Cargo.toml --all-targets -- -D warnings
          cargo fmt --manifest-path fuzz/Cargo.toml -- --check
          cargo clippy --locked --manifest-path fuzz/Cargo.toml --all-features --bins -- -D warnings

      - name: Run deterministic chaos scenarios
        run: cargo run --locked --manifest-path chaos/Cargo.toml -- --seed 12648430

      - name: Run short fixed-seed fuzz smoke
        shell: bash
        run: |
          while read -r target seed runs; do
            bash fuzz/run-target.sh "$target" runs "$runs" "$seed"
          done <<'TARGETS'
          session_event_parser 12648430 128
          config_parser 195936478 128
          provider_stream_parser 3735928559 128
          mcp_protocol_parser 3221344269 128
          render_parser 4207849484 8
          TARGETS

  scheduled-bounded-fuzz:
    if: github.event_name == 'schedule' || inputs.run_bounded_fuzz == true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - target: session_event_parser
            seed: 12648430
          - target: config_parser
            seed: 195936478
          - target: provider_stream_parser
            seed: 3735928559
          - target: mcp_protocol_parser
            seed: 3221344269
          - target: render_parser
            seed: 4207849484
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust fuzz toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          rustup toolchain install "$HEYCODE_FUZZ_TOOLCHAIN" --profile minimal --component rust-src
          cargo install cargo-fuzz --version 0.13.2 --locked

      - name: Run bounded scheduled target
        run: |
          cargo metadata --locked --no-deps \
            --manifest-path fuzz/Cargo.toml \
            --features "${{ matrix.target }}" \
            --format-version 1 >/dev/null
          bash fuzz/run-target.sh "${{ matrix.target }}" seconds 180 "${{ matrix.seed }}"
