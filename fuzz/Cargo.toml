[workspace]
members = ["."]
resolver = "2"

[package]
name = "heycode-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[features]
default = []
session_event_parser = ["dep:heycode-session"]
config_parser = ["dep:heycode-config"]
provider_stream_parser = ["dep:heycode-llm"]
mcp_protocol_parser = ["dep:heycode-mcp"]
render_parser = ["dep:heycode-agent", "dep:heycode-tui", "dep:ratatui"]

[dependencies]
heycode-agent = { path = "../crates/heycode-agent", optional = true }
heycode-config = { path = "../crates/heycode-config", optional = true }
heycode-llm = { path = "../crates/heycode-llm", optional = true }
heycode-mcp = { path = "../crates/heycode-mcp", optional = true }
heycode-session = { path = "../crates/heycode-session", optional = true }
heycode-tui = { path = "../crates/heycode-tui", optional = true }
libfuzzer-sys = "0.4"
ratatui = { version = "0.29", optional = true }
serde_json = "1"
tempfile = "3"

[[bin]]
name = "session_event_parser"
path = "fuzz_targets/session_event_parser.rs"
test = false
doc = false
bench = false
required-features = ["session_event_parser"]

[[bin]]
name = "config_parser"
path = "fuzz_targets/config_parser.rs"
test = false
doc = false
bench = false
required-features = ["config_parser"]

[[bin]]
name = "provider_stream_parser"
path = "fuzz_targets/provider_stream_parser.rs"
test = false
doc = false
bench = false
required-features = ["provider_stream_parser"]

[[bin]]
name = "mcp_protocol_parser"
path = "fuzz_targets/mcp_protocol_parser.rs"
test = false
doc = false
bench = false
required-features = ["mcp_protocol_parser"]

[[bin]]
name = "render_parser"
path = "fuzz_targets/render_parser.rs"
test = false
doc = false
bench = false
required-features = ["render_parser"]

[profile.release]
debug = 1
