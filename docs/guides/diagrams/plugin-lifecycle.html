<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>heycode plugin activation lifecycle</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #f5f5f5;
      --ink: #2d3142;
      --muted: #4f5d75;
      --soft: #7a8399;
      --accent: #eb6c36;
      --sans: 'Geist', system-ui, sans-serif;
      --serif: 'Instrument Serif', serif;
      --mono: 'Geist Mono', ui-monospace, monospace;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 32px;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
    }
    .frame { width: 100%; max-width: 960px; }
    .eyebrow {
      margin-bottom: 8px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 8px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    h1 {
      margin-bottom: 24px;
      color: var(--ink);
      font-family: var(--serif);
      font-size: 28px;
      font-weight: 400;
      line-height: 1.15;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">State machine · activation transaction</p>
    <h1>A plugin is live only after apply and descriptor recording commit together</h1>
    <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="plugin-lifecycle-title plugin-lifecycle-desc">
      <title id="plugin-lifecycle-title">heycode plugin activation lifecycle</title>
      <desc id="plugin-lifecycle-desc">State machine showing a plugin candidate passing admission, declaration, apply, and commit into the active state, while any open transaction error rolls back and composition aborts.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
        </marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Transitions -->
      <line x1="60" y1="220" x2="88" y2="220" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="216" y1="220" x2="264" y2="220" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="392" y1="220" x2="440" y2="220" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="568" y1="220" x2="616" y2="220" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="744" y1="220" x2="792" y2="220" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <line x1="520" y1="260" x2="520" y2="360" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <path d="M 856 260 V 488 Q 856 496 848 496 H 544 Q 536 496 536 504 V 512 Q 536 520 528 520" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="520" y1="440" x2="520" y2="512" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Transition labels -->
      <rect x="220" y="196" width="40" height="16" rx="4" fill="#f5f5f5"/>
      <text x="240" y="208" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">ADMIT</text>
      <rect x="396" y="196" width="40" height="16" rx="4" fill="#f5f5f5"/>
      <text x="416" y="208" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">DECLARE</text>
      <rect x="572" y="196" width="40" height="16" rx="4" fill="#f5f5f5"/>
      <text x="592" y="208" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">APPLY</text>
      <rect x="748" y="196" width="40" height="16" rx="4" fill="#f5f5f5"/>
      <text x="768" y="208" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">COMMIT</text>
      <rect x="532" y="292" width="72" height="16" rx="4" fill="#f5f5f5"/>
      <text x="568" y="304" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">ERROR / UNWIND</text>
      <rect x="684" y="472" width="72" height="16" rx="4" fill="#f5f5f5"/>
      <text x="720" y="484" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">SHUTDOWN</text>
      <rect x="532" y="468" width="96" height="16" rx="4" fill="#f5f5f5"/>
      <text x="580" y="480" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">ABORT</text>

      <!-- Single wildcard annotation for transaction failures -->
      <text x="608" y="340" fill="#4f5d75" font-size="16" font-style="italic" font-family="'Instrument Serif', serif">Any open transaction error takes the same verified rollback path.</text>

      <!-- Start -->
      <circle cx="52" cy="220" r="6" fill="#2d3142"/>

      <!-- States -->
      <rect x="88" y="180" width="128" height="80" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="100" y="188" width="40" height="16" rx="4" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="120" y="200" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">STATE</text>
      <text x="152" y="228" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Candidate</text>
      <text x="152" y="244" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">selected scope</text>

      <rect x="264" y="180" width="128" height="80" rx="8" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="276" y="188" width="40" height="16" rx="4" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="296" y="200" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">STATE</text>
      <text x="328" y="228" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Transaction</text>
      <text x="328" y="244" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">fingerprint open</text>

      <rect x="440" y="180" width="128" height="80" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="452" y="188" width="40" height="16" rx="4" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="472" y="200" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">STATE</text>
      <text x="504" y="228" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Declared</text>
      <text x="504" y="244" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">exact rows</text>

      <rect x="616" y="180" width="128" height="80" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="628" y="188" width="40" height="16" rx="4" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="648" y="200" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">STATE</text>
      <text x="680" y="228" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Applied</text>
      <text x="680" y="244" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">services · effects</text>

      <rect x="792" y="180" width="128" height="80" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <rect x="804" y="188" width="40" height="16" rx="4" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="824" y="200" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">STATE</text>
      <text x="856" y="228" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Active</text>
      <text x="856" y="244" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">descriptor recorded</text>

      <rect x="440" y="360" width="160" height="80" rx="8" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="452" y="368" width="40" height="16" rx="4" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="472" y="380" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">STATE</text>
      <text x="520" y="408" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Rolled back</text>
      <text x="520" y="424" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">fingerprint restored</text>

      <!-- End -->
      <circle cx="520" cy="520" r="8" fill="none" stroke="#2d3142" stroke-width="1"/>
      <circle cx="520" cy="520" r="5" fill="#2d3142"/>

      <!-- Legend -->
      <line x1="40" y1="552" x2="920" y2="552" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="40" y="576" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <line x1="152" y1="572" x2="200" y2="572" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="216" y="576" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">NORMAL TRANSITION</text>
      <line x1="408" y1="572" x2="456" y2="572" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="472" y="576" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">FAILURE / ROLLBACK</text>
    </svg>
  </main>
</body>
</html>
