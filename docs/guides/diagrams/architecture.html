<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>heycode composition and runtime architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #f5f5f5;
      --ink: #2d3142;
      --muted: #4f5d75;
      --soft: #7a8399;
      --accent: #eb6c36;
      --link: #2e5aa8;
      --sans: 'Geist', system-ui, sans-serif;
      --serif: 'Instrument Serif', serif;
      --mono: 'Geist Mono', ui-monospace, monospace;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 32px;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
    }
    .frame { width: 100%; max-width: 1280px; }
    .eyebrow {
      margin-bottom: 8px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 8px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    h1 {
      margin-bottom: 24px;
      color: var(--ink);
      font-family: var(--serif);
      font-size: 28px;
      font-weight: 400;
      line-height: 1.15;
    }
    svg { width: 100%; min-width: 960px; display: block; }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Architecture · current code contracts</p>
    <h1>heycode composes capabilities, then reconstructs every model call from durable truth</h1>

      <title id="heycode-architecture-title">heycode composition and runtime architecture</title>
      <desc id="heycode-architecture-desc">Architecture overview showing the CLI selecting scoped plugins into a Context, human surfaces and the Agent consuming its services, session JSONL providing durable projection, and verified calls reaching a provider or delegated runtime.</desc>

        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
        </marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Zones -->

      <text x="804" y="144" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">RUNTIME</text>
      <rect x="488" y="352" width="208" height="128" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <rect x="504" y="356" width="88" height="16" rx="4" fill="#f5f5f5"/>
      <text x="548" y="368" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">DURABLE</text>

      <line x1="224" y1="232" x2="288" y2="232" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <text x="700" y="332" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">APPEND</text>
      <rect x="688" y="352" width="56" height="16" rx="4" fill="#f5f5f5"/>
      <text x="716" y="364" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PROJECT</text>

      <rect x="1016" y="192" width="184" height="80" rx="8" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="1028" y="200" width="64" height="16" rx="4" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="1060" y="212" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">EXTERNAL</text>
      <text x="1108" y="236" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Provider / runtime</text>
      <text x="1108" y="252" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">HTTP · child protocol</text>

      <rect x="512" y="400" width="160" height="64" rx="8" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>

      <text x="548" y="420" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">STORE</text>

      <line x1="40" y1="648" x2="1240" y2="648" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>

      <line x1="152" y1="668" x2="200" y2="668" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="216" y="672" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">CALL / OWNERSHIP</text>
      <line x1="384" y1="668" x2="432" y2="668" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="448" y="672" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">PROJECTION / PASSIVE</text>
      <line x1="688" y1="668" x2="736" y2="668" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <text x="752" y="672" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">DURABLE COMMIT</text>
    </svg>
  </main>
</body>
</html>
