<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>heycode session-v2 verified request sequence</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #f5f5f5;
      --ink: #2d3142;
      --muted: #4f5d75;
      --soft: #7a8399;
      --accent: #eb6c36;
      --link: #2e5aa8;
      --sans: 'Geist', system-ui, sans-serif;
      --serif: 'Instrument Serif', serif;
      --mono: 'Geist Mono', ui-monospace, monospace;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 32px;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
    }
    .frame { width: 100%; max-width: 1280px; }
    .eyebrow {
      margin-bottom: 8px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 8px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    h1 {
      margin-bottom: 24px;
      color: var(--ink);
      font-family: var(--serif);
      font-size: 28px;
      font-weight: 400;
      line-height: 1.15;
    }
    svg { width: 100%; min-width: 960px; display: block; }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Sequence · session v2 and verified dispatch</p>
    <h1>The provider sees only a call independently reconstructed from committed JSONL</h1>
    <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="session-v2-title session-v2-desc">
      <title id="session-v2-title">heycode session-v2 verified request sequence</title>
      <desc id="session-v2-desc">Sequence showing a human input entering the Agent, durable input and request snapshots committing to Session JSONL, the C05 projector independently reconstructing and verifying the call, provider dispatch, normalized output, and terminal state committing back to the log.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
        </marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Lifelines -->
      <line x1="120" y1="112" x2="120" y2="624" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="360" y1="112" x2="360" y2="624" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="600" y1="112" x2="600" y2="624" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="840" y1="112" x2="840" y2="624" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="1080" y1="112" x2="1080" y2="624" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- Activation bars -->
      <rect x="356" y="152" width="8" height="456" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="596" y="196" width="8" height="416" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="836" y="328" width="8" height="152" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="1076" y="504" width="8" height="64" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

      <!-- Messages -->
      <line x1="120" y1="160" x2="360" y2="160" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="360" y1="204" x2="600" y2="204" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="600" y1="248" x2="360" y2="248" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <line x1="360" y1="292" x2="600" y2="292" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="360" y1="336" x2="840" y2="336" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="840" y1="380" x2="600" y2="380" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="600" y1="424" x2="840" y2="424" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <line x1="840" y1="468" x2="360" y2="468" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <line x1="360" y1="512" x2="1080" y2="512" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <line x1="1080" y1="556" x2="360" y2="556" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <line x1="360" y1="600" x2="600" y2="600" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Message labels -->
      <rect x="196" y="136" width="88" height="16" rx="4" fill="#f5f5f5"/>
      <text x="240" y="148" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">SUBMIT INPUT</text>
      <rect x="436" y="180" width="88" height="16" rx="4" fill="#f5f5f5"/>
      <text x="480" y="192" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">APPEND INPUT</text>
      <rect x="440" y="224" width="80" height="16" rx="4" fill="#f5f5f5"/>
      <text x="480" y="236" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">COMMITTED</text>
      <rect x="440" y="268" width="80" height="16" rx="4" fill="#f5f5f5"/>
      <text x="480" y="280" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">SNAPSHOTS</text>
      <rect x="684" y="312" width="72" height="16" rx="4" fill="#f5f5f5"/>
      <text x="720" y="324" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">PROJECT</text>
      <rect x="684" y="356" width="72" height="16" rx="4" fill="#f5f5f5"/>
      <text x="720" y="368" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">READ LOG</text>
      <rect x="680" y="400" width="80" height="16" rx="4" fill="#f5f5f5"/>
      <text x="720" y="412" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">PROJECTED</text>
      <rect x="440" y="444" width="80" height="16" rx="4" fill="#f5f5f5"/>
      <text x="480" y="456" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">VERIFIED</text>
      <rect x="924" y="488" width="72" height="16" rx="4" fill="#f5f5f5"/>
      <text x="960" y="500" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">DISPATCH</text>
      <rect x="920" y="532" width="80" height="16" rx="4" fill="#f5f5f5"/>
      <text x="960" y="544" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">NORMALIZED</text>
      <rect x="428" y="576" width="104" height="16" rx="4" fill="#f5f5f5"/>
      <text x="480" y="588" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">COMMIT OUTPUT</text>

      <!-- Actors -->
      <rect x="40" y="48" width="160" height="64" rx="8" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="52" y="56" width="48" height="16" rx="4" fill="transparent" stroke="rgba(122,131,153,0.50)" stroke-width="0.8"/>
      <text x="76" y="68" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">ACTOR</text>
      <text x="120" y="88" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Human surface</text>
      <text x="120" y="104" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">TUI · CLI · SDK</text>

      <rect x="280" y="48" width="160" height="64" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="292" y="56" width="48" height="16" rx="4" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="316" y="68" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">ACTOR</text>
      <text x="360" y="88" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Agent</text>
      <text x="360" y="104" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">turn owner</text>

      <rect x="520" y="48" width="160" height="64" rx="8" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="532" y="56" width="48" height="16" rx="4" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="556" y="68" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">STORE</text>
      <text x="600" y="88" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Session JSONL</text>
      <text x="600" y="104" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">append-only v2</text>

      <rect x="760" y="48" width="160" height="64" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="772" y="56" width="48" height="16" rx="4" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="796" y="68" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">ACTOR</text>
      <text x="840" y="88" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">C05 projector</text>
      <text x="840" y="104" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">independent verify</text>

      <rect x="1000" y="48" width="160" height="64" rx="8" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="1012" y="56" width="48" height="16" rx="4" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="1036" y="68" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">ACTOR</text>
      <text x="1080" y="88" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Provider / runtime</text>
      <text x="1080" y="104" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">external boundary</text>

      <!-- Legend -->
      <line x1="40" y1="648" x2="1240" y2="648" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="40" y="676" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <line x1="152" y1="672" x2="200" y2="672" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="216" y="676" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">CALL / COMMIT</text>
      <line x1="384" y1="672" x2="432" y2="672" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="448" y="676" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">RETURN / STREAM</text>
      <line x1="664" y1="672" x2="712" y2="672" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <text x="728" y="676" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">VERIFIED CAPABILITY</text>
    </svg>
  </main>
</body>
</html>
