[workspace]
members = ["."]
resolver = "2"

[package]
name = "heycode-chaos"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
heycode-core = { path = "../crates/heycode-core" }
heycode-exec = { path = "../crates/heycode-exec" }
heycode-http = { path = "../crates/heycode-http" }
heycode-llm = { path = "../crates/heycode-llm" }
heycode-session = { path = "../crates/heycode-session" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }

